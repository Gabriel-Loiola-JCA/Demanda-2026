<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<meta name="description" content="Radar de Demanda: shows, festivais, feriados, provas e jogos que movimentam viagens. Revenue · Grupo JCA.">
<title>Radar de Demanda</title>
<link rel="icon" href="marca/favicon.png">
<style>
/* Radar no padrão do HELIOS: preto absoluto, um destaque dourado, tudo arredondado. */
:root {
  --bg: #0b0b0c; --surface: rgba(255,255,255,.04); --surface-2: rgba(255,255,255,.07); --solid: #151517;
  --ink: #f4f2ec; --ink-2: #c9c7c0; --muted: #8e8c86; --line: rgba(244,242,236,.10); --line-2: rgba(244,242,236,.18);
  --accent: #d9a94e; --accent-soft: rgba(217,169,78,.14); --lo: #6f9e91; --mid: #c7a25a; --hi: #c47a6c;
  --font: "Segoe UI Variable Text", "Segoe UI", Inter, system-ui, -apple-system, sans-serif;
  --r: 18px; --r-lg: 24px; color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f4f3ef; --surface: rgba(0,0,0,.035); --surface-2: rgba(0,0,0,.06); --solid: #ffffff;
  --ink: #161616; --ink-2: #3a3a3c; --muted: #6f6d67; --line: rgba(20,20,20,.10); --line-2: rgba(20,20,20,.18);
  --accent: #9a7434; --accent-soft: rgba(154,116,52,.12); --lo: #4f8a7c; --mid: #a7802f; --hi: #b06656; color-scheme: light;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]):not([data-theme="light"]) {
  --bg: #f4f3ef; --surface: rgba(0,0,0,.035); --surface-2: rgba(0,0,0,.06); --solid: #ffffff;
  --ink: #161616; --ink-2: #3a3a3c; --muted: #6f6d67; --line: rgba(20,20,20,.10); --line-2: rgba(20,20,20,.18);
  --accent: #9a7434; --accent-soft: rgba(154,116,52,.12); --lo: #4f8a7c; --mid: #a7802f; --hi: #b06656; color-scheme: light; } }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { min-height: 100vh; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased;
  background-image: radial-gradient(1100px 600px at 90% -10%, var(--accent-soft), transparent 60%); background-attachment: fixed; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 980px; margin: 0 auto; padding: 28px max(18px, env(safe-area-inset-right)) 40px max(18px, env(safe-area-inset-left)); }
body.embed .wrap { max-width: none; padding-top: 18px; }

/* topo */
.top { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
.top img { height: 26px; width: auto; }
.top h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.02em; }
.top small { display: block; color: var(--muted); font-size: 12.5px; letter-spacing: 0; font-weight: 400; }
.top .sp { flex: 1; }
body.embed .top img { display: none; }

/* "o que temos" */
.ask { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.seg { display: inline-flex; padding: 4px; gap: 2px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.seg button { height: 34px; padding: 0 15px; border: 0; border-radius: 999px; background: none; color: var(--ink-2); font-weight: 500; white-space: nowrap; }
.seg button.on { background: var(--ink); color: var(--bg); }
.seg button:hover:not(.on) { background: var(--surface-2); color: var(--ink); }
.pick { height: 42px; padding: 0 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink-2); }
.pick.on { border-color: var(--accent); color: var(--ink); }
.chips { display: flex; gap: 6px; margin-top: 12px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 32px; padding: 0 13px; border: 1px solid var(--line); border-radius: 999px; background: none; color: var(--muted); font-size: 13px; }
.chip.on { border-color: var(--line-2); background: var(--surface-2); color: var(--ink); }

/* faixa de pressão: próximos 60 dias */
.strip { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(8px, 1fr); align-items: end; gap: 3px; height: 54px; margin: 22px 0 6px; }
.strip button { position: relative; height: calc(8px + var(--h) * 46px); padding: 0; border: 0; border-radius: 999px; background: color-mix(in oklab, var(--c) 78%, transparent); opacity: .85; transition: opacity .15s, transform .15s; }
.strip button:hover { opacity: 1; transform: scaleY(1.04); }
.strip button.sel { outline: 2px solid var(--ink); outline-offset: 2px; opacity: 1; }
.strip button.wk::after { content: ""; position: absolute; left: 50%; bottom: -8px; width: 3px; height: 3px; margin-left: -1.5px; border-radius: 50%; background: var(--muted); }
.strip-legend { display: flex; justify-content: space-between; color: var(--muted); font-size: 11.5px; margin-bottom: 18px; }

/* lista */
.summary { margin: 4px 0 14px; color: var(--muted); font-size: 13px; }
.summary b { color: var(--ink); font-weight: 600; }
.day { margin-top: 18px; }
.day h2 { position: sticky; top: 0; z-index: 2; margin: 0 0 8px; padding: 8px 0; background: linear-gradient(var(--bg) 70%, transparent); color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
.day h2 em { font-style: normal; color: var(--accent); }
.ev { display: grid; grid-template-columns: 48px 1fr auto; align-items: center; gap: 14px; width: 100%; padding: 10px 14px 10px 10px; margin-bottom: 6px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); text-align: left; transition: border-color .15s, background .15s; }
.ev:hover { border-color: var(--line-2); background: var(--surface-2); }
.av { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; background: var(--surface-2); box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--ring, var(--line-2)); }
.av.mono { display: grid; place-items: center; color: var(--ink); font-weight: 650; font-size: 15px; background: color-mix(in oklab, var(--ring) 30%, var(--solid)); }
.ev strong { display: block; font-size: 15px; font-weight: 600; letter-spacing: -.01em; line-height: 1.3; }
.ev small { display: block; margin-top: 2px; color: var(--muted); font-size: 12.5px; }
.ix { min-width: 44px; height: 28px; padding: 0 10px; display: grid; place-items: center; border-radius: 999px; font-size: 12.5px; font-weight: 650; font-variant-numeric: tabular-nums; color: var(--ink); background: color-mix(in oklab, var(--c) 22%, transparent); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--c) 45%, transparent); }
.more { grid-column: 2 / -1; display: none; margin-top: 6px; color: var(--ink-2); font-size: 13.5px; }
.ev.open .more { display: block; }
.more a { color: var(--accent); text-decoration: none; }
.empty { padding: 36px 0; text-align: center; color: var(--muted); }
.past { display: block; margin: 22px auto 0; height: 36px; padding: 0 16px; border: 1px solid var(--line); border-radius: 999px; background: none; color: var(--muted); }
footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 34px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
footer img { height: 18px; opacity: .8; }
@media (max-width: 560px) { .top h1 { font-size: 19px; } .ev { grid-template-columns: 42px 1fr auto; } .av { width: 42px; height: 42px; } .strip { grid-auto-columns: minmax(4px, 1fr); gap: 2px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <img id="logo" src="marca/revenue-escuro.png" alt="Revenue">
    <div><h1>Radar de Demanda</h1><small id="updated">Shows, festivais, feriados, provas e jogos</small></div>
    <span class="sp"></span>
  </header>

  <div class="ask">
    <div class="seg" id="when" role="group" aria-label="O que temos">
      <button type="button" data-w="hoje" class="on">Hoje</button><button type="button" data-w="7">7 dias</button><button type="button" data-w="30">30 dias</button><button type="button" data-w="tudo">Tudo</button>
    </div>
    <input class="pick" id="day" type="date" aria-label="Escolher um dia">
    <select class="pick" id="place" aria-label="Praça"><option value="">Todas as praças</option></select>
  </div>
  <div class="chips" id="cats" role="group" aria-label="Tipo"></div>

  <div class="strip" id="strip" aria-label="Pressão de demanda nos próximos 60 dias"></div>
  <div class="strip-legend"><span id="stripFrom"></span><span>altura e cor = pressão de demanda</span><span id="stripTo"></span></div>

  <p class="summary" id="summary"></p>
  <div id="list"></div>
  <button class="past" id="past" type="button">Mostrar o que já passou</button>

  <footer><span>Fontes públicas: organizadores, bilheterias, prefeituras e federações. Datas podem mudar.</span><img id="logoFoot" src="marca/revenue-escuro.png" alt="Revenue"></footer>
</div>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const q = new URLSearchParams(location.search);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = { get(k) { try { return localStorage.getItem('radar.' + k); } catch { return null; } }, set(k, v) { try { localStorage.setItem('radar.' + k, v); } catch {} } };
if (q.get('embed')) document.body.classList.add('embed');
const theme = q.get('tema') === 'claro' ? 'light' : q.get('tema') === 'escuro' ? 'dark' : null;
if (theme) document.documentElement.dataset.theme = theme;
const light = () => document.documentElement.dataset.theme === 'light' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: light)').matches);
const setLogo = () => { const f = light() ? 'marca/revenue-claro.png' : 'marca/revenue-escuro.png'; $('logo').src = f; $('logoFoot').src = f; };
setLogo();

const WEEK = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
const MON = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const asDate = (s) => new Date(`${s}T12:00:00`);
const addDays = (s, n) => iso(new Date(asDate(s).getTime() + n * 864e5));
const TODAY = iso(new Date());
const label = (s) => { const d = asDate(s); return `${WEEK[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`; };
const range = (e) => (e.d2 && e.d2 !== e.d ? `${label(e.d)} a ${label(e.d2)}` : label(e.d));
const color = (i) => (i >= 70 ? 'var(--hi)' : i >= 45 ? 'var(--mid)' : 'var(--lo)');
const CATC = { feriado: '#c47a6c', show: '#9a82d6', festival: '#d9a94e', futebol: '#55ab93', prova: '#6a8fd6', feira: '#62a6d0', sazonal: '#c99a5a', corporativo: '#8e8c86', eleicao: '#74ad78' };
const initials = (n) => n.replace(/[^A-Za-zÀ-ÿ0-9 ]/g, ' ').split(/\s+/).filter((w) => w.length > 2 || /^[A-Z0-9]+$/.test(w)).slice(0, 2).map((w) => w[0]).join('').toUpperCase() || '•';

const st = { w: q.get('dia') ? 'dia' : (store.get('w') || 'hoje'), day: q.get('dia') || '', place: q.get('praca') || store.get('place') || '', cat: '', past: false };
let DATA = { eventos: [], categorias: {} };

function inWindow(e) {
  const end = e.d2 || e.d;
  if (st.w === 'dia') return e.d <= st.day && end >= st.day;
  if (!st.past && end < TODAY) return false;
  if (st.w === 'hoje') return e.d <= TODAY && end >= TODAY;
  if (st.w === 'tudo') return true;
  const last = addDays(TODAY, Number(st.w) - 1);
  return e.d <= last && end >= (st.past ? '0000' : TODAY);
}
const placeOk = (e) => !st.place || e.p === st.place || e.p === 'Nacional' || e.p === 'Multi';
const catOk = (e) => !st.cat || e.c === st.cat;

function render() {
  document.querySelectorAll('#when button').forEach((b) => b.classList.toggle('on', b.dataset.w === st.w));
  $('day').classList.toggle('on', st.w === 'dia');
  $('day').value = st.w === 'dia' ? st.day : '';
  const list = DATA.eventos.filter((e) => inWindow(e) && placeOk(e) && catOk(e));
  // agrupa pelo primeiro dia que importa (o dia escolhido, hoje ou o início)
  const key = (e) => (st.w === 'dia' ? st.day : st.w === 'hoje' ? TODAY : e.d < TODAY && !st.past ? TODAY : e.d);
  const groups = new Map();
  list.sort((a, b) => key(a).localeCompare(key(b)) || b.i - a.i).forEach((e) => { const k = key(e); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(e); });
  const top = list.slice().sort((a, b) => b.i - a.i)[0];
  const when = st.w === 'dia' ? label(st.day) : st.w === 'hoje' ? 'hoje' : st.w === 'tudo' ? 'no calendário' : `nos próximos ${st.w} dias`;
  $('summary').innerHTML = list.length ? `<b>${list.length}</b> ${list.length === 1 ? 'evento' : 'eventos'} ${when}${top ? ` · maior pressão: <b>${esc(top.n)}</b>` : ''}` : '';
  $('list').innerHTML = list.length ? [...groups].map(([k, evs]) => `<section class="day"><h2>${k === TODAY ? '<em>hoje</em> · ' : ''}${label(k)}</h2>${evs.map(row).join('')}</section>`).join('')
    : `<p class="empty">Nada marcado ${when}${st.place ? ` em ${esc(st.place)}` : ''}.</p>`;
  $('past').textContent = st.past ? 'Esconder o que já passou' : 'Mostrar o que já passou';
  $('past').hidden = st.w === 'dia' || st.w === 'hoje';
  drawStrip();
}
function row(e) {
  const ring = CATC[e.c] || 'var(--line-2)';
  const av = e.img ? `<img class="av" src="${esc(e.img)}" alt="" loading="lazy" style="--ring:${ring}">` : `<span class="av mono" style="--ring:${ring}">${esc(initials(e.n))}</span>`;
  const cat = DATA.categorias[e.c] || e.c;
  return `<button type="button" class="ev" aria-expanded="false">${av}<span><strong>${esc(e.n)}</strong><small>${esc(e.p === 'Multi' ? 'Várias praças' : e.p)} · ${esc(cat)}${e.d2 && e.d2 !== e.d ? ` · ${range(e)}` : ''}</small></span><span class="ix" style="--c:${color(e.i)}" title="Pressão de demanda, de 0 a 100">${e.i}</span>
    <span class="more">${esc(e.s || '')}${e.src ? ` <a href="${esc(e.src)}" target="_blank" rel="noopener">Fonte</a>` : ''}</span></button>`;
}
function drawStrip() {
  const days = Array.from({ length: 60 }, (_, i) => addDays(TODAY, i));
  $('strip').innerHTML = days.map((d) => {
    const evs = DATA.eventos.filter((e) => e.d <= d && (e.d2 || e.d) >= d && placeOk(e) && catOk(e));
    const peak = evs.reduce((m, e) => Math.max(m, e.i), 0);
    const wd = asDate(d).getDay();
    return `<button type="button" data-d="${d}" class="${st.w === 'dia' && st.day === d ? 'sel' : ''}${wd === 0 || wd === 6 ? ' wk' : ''}" style="--h:${(peak / 100).toFixed(2)};--c:${peak ? color(peak) : 'var(--line-2)'}" title="${esc(`${label(d)} · ${evs.length ? `${evs.length} ${evs.length === 1 ? 'evento' : 'eventos'} · pressão ${peak}` : 'sem evento marcado'}`)}"></button>`;
  }).join('');
  $('stripFrom').textContent = label(days[0]);
  $('stripTo').textContent = label(days[days.length - 1]);
}
function fillControls() {
  const places = [...new Set(DATA.eventos.map((e) => e.p).filter((p) => p !== 'Nacional' && p !== 'Multi'))].sort((a, b) => a.localeCompare(b, 'pt-BR'));
  $('place').innerHTML = '<option value="">Todas as praças</option>' + places.map((p) => `<option${p === st.place ? ' selected' : ''}>${esc(p)}</option>`).join('');
  const used = new Set(DATA.eventos.map((e) => e.c));
  $('cats').innerHTML = '<button type="button" class="chip on" data-c="">Tudo</button>' + Object.entries(DATA.categorias).filter(([k]) => used.has(k)).map(([k, v]) => `<button type="button" class="chip" data-c="${k}">${esc(v)}</button>`).join('');
}
$('when').addEventListener('click', (e) => { const b = e.target.closest('button[data-w]'); if (!b) return; st.w = b.dataset.w; store.set('w', st.w); render(); });
$('day').addEventListener('change', (e) => { if (e.target.value) { st.w = 'dia'; st.day = e.target.value; } else { st.w = 'hoje'; } render(); });
$('place').addEventListener('change', (e) => { st.place = e.target.value; store.set('place', st.place); render(); });
$('cats').addEventListener('click', (e) => { const b = e.target.closest('.chip'); if (!b) return; st.cat = b.dataset.c; document.querySelectorAll('.chip').forEach((c) => c.classList.toggle('on', c === b)); render(); });
$('strip').addEventListener('click', (e) => { const b = e.target.closest('button[data-d]'); if (!b) return; st.w = 'dia'; st.day = b.dataset.d; render(); });
$('list').addEventListener('click', (e) => { const ev = e.target.closest('.ev'); if (!ev || e.target.closest('a')) return; ev.classList.toggle('open'); ev.setAttribute('aria-expanded', String(ev.classList.contains('open'))); });
$('past').addEventListener('click', () => { st.past = !st.past; render(); });
document.addEventListener('error', (e) => { const img = e.target; if (img.classList && img.classList.contains('av')) { const s = document.createElement('span'); s.className = 'av mono'; s.style.cssText = img.style.cssText; s.textContent = '•'; img.replaceWith(s); } }, true);
// o HELIOS pode pedir um dia e uma praça sem recarregar a página
addEventListener('message', (e) => { const m = e.data || {}; if (m.radar !== 'dia') return; if (m.dia) { st.w = 'dia'; st.day = m.dia; } if ('praca' in m) st.place = m.praca || ''; render(); });

fetch('data/eventos.json', { cache: 'no-cache' }).then((r) => r.json()).then((d) => {
  DATA = d;
  const [y, m, dd] = (d.atualizado || '').split('-');
  if (y) $('updated').textContent = `Shows, festivais, feriados, provas e jogos · atualizado em ${dd}/${m}/${y}`;
  fillControls();
  render();
}).catch(() => { $('list').innerHTML = '<p class="empty">Não consegui carregar os eventos agora. Tente de novo em instantes.</p>'; });
</script>
</body>
</html>
